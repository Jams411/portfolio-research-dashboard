name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.11 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run full test suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q app.py portfolio_dashboard tests scripts

      - name: Import application modules
        run: |
          python -c "import portfolio_dashboard.config, portfolio_dashboard.construction, portfolio_dashboard.data, portfolio_dashboard.etf_research, portfolio_dashboard.formatting, portfolio_dashboard.performance, portfolio_dashboard.pipeline, portfolio_dashboard.rebalancing, portfolio_dashboard.reporting, portfolio_dashboard.research, portfolio_dashboard.risk, portfolio_dashboard.strategy, portfolio_dashboard.stress; print('All application modules imported')"

      - name: Validate Streamlit configuration
        run: streamlit config show >/dev/null

      - name: Run non-socket Streamlit smoke test
        run: python -m pytest -q tests/test_app.py

      - name: Validate Markdown links
        run: python scripts/validate_markdown_links.py

      - name: Check repository diff
        run: git diff --check
