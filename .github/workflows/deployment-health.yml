name: Deployment health

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 07 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-health
  cancel-in-progress: true

jobs:
  check:
    name: Check Streamlit deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check deployed URL
        run: >-
          python scripts/check_deployment.py
          https://portfolio-research-dashboard.streamlit.app
          --timeout 15
          --max-redirects 8
